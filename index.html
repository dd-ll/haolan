    /* ========== CSS 变量（与子页面统一） ========== */
    :root {
      --red: #C8102E;

      --gold: #C9A961;
      --gold-deep: #B4941F;
      --ink: #1A1A1A;
      --gray: #6B7280;
      --bg: #FFFFFF;

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* ========== 顶部导航（鎏金渐变 + 深藏青文字） ========== */
    .topbar {

      color: var(--nav-text);
      border-bottom: 2px solid rgba(34,51,79,0.2);
      box-shadow: 0 2px 10px rgba(34,51,79,0.15);
    }
    .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo-card {
      display: inline-flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 6px; padding: 4px 10px;
      border: 1px solid rgba(34,51,79,0.25);
    }
    .logo-card img { height: 44px; width: auto; display: block; }
    .nav { margin-left: auto; padding: 14px 0; }
    .nav-row { display: flex; flex-wrap: wrap; gap: 30px; font-size: 14px; }
    .nav-row a { color: rgba(34,51,79,0.88); transition: color .2s; padding: 4px 0; }
    .nav-row a:hover { color: var(--nav-text-hover); }

    /* ========== Hero（front-desk 实景大图 + 深色遮罩，撑满首屏） ========== */
    .hero {
      position: relative;
      flex: 1;
      min-height: 480px;
      background: #4D020E;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    /* 深色遮罩保证文字可读 */
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.32) 0%,
        rgba(0,0,0,0.42) 55%,
        rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }
    /* ========== 页脚（深藏青底 + 鎏金顶边 + 金 H + 联系信息） ========== */
    footer {
      background: var(--navy);
      color: #fff;
      padding: 30px 0 40px;
      position: relative;
      border-top: 3px solid var(--gold-warm);
    }
    footer .container {
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-logo {
      display: flex; align-items: center; gap: 12px;
    }
    .footer-logo .hl-icon {
      width: 52px; height: 52px;
      background: #fff;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: "STSong", serif;
      font-size: 30px; font-weight: 700;
      color: var(--gold-warm);
      position: relative;
    }
    .footer-logo .hl-icon::before {
      content: ""; position: absolute; inset: 6px;
      border: 2px solid var(--gold-warm);
      border-radius: 3px;
    }
    .footer-logo .hl-icon span {
      position: relative; z-index: 1; line-height: 1;
    }
    .footer-name {
      font-family: "STSong","SimSun",serif;
      font-size: 22px; font-weight: 700;
      color: var(--gold-warm);
      letter-spacing: 2px;
    }
    .footer-info { text-align: right; }
    .footer-info p {
      font-size: 13px; color: #fff;
      line-height: 1.9;
    }

    /* ========== 响应式适配（横屏/竖屏） ========== */
    @media (max-width: 960px) {
      .topbar-inner { gap: 16px; }
      .nav { margin-left: 0; }
      .nav-row { gap: 18px; font-size: 13px; }
      .hero { min-height: 360px; }
      footer .container { flex-direction: column; gap: 24px; text-align: center; }
      .footer-info { text-align: center; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 0 16px; gap: 12px; }
      .nav { padding: 10px 0; }
      .nav-row { gap: 12px; font-size: 13px; }
      .hero { min-height: 300px; }
    }
  </style>
