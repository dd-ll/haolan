    /* ========== CSS 变量（与子页面统一） ========== */
    :root {

      --ink: #1A1A1A;

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* ========== 顶部导航（鎏金渐变 + 深藏青文字） ========== */

      border-bottom: 2px solid rgba(34,51,79,0.2);
      box-shadow: 0 2px 10px rgba(34,51,79,0.15);
    }
    .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; text-decoration: none; }
    .logo-card {
      display: inline-flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 6px; padding: 4px 10px;
      border: 1px solid rgba(34,51,79,0.25);
    }
    .logo-card img { height: 44px; width: auto; display: block; }
    .nav { margin-left: auto; padding: 14px 0; }
    .nav-row { display: flex; flex-wrap: wrap; gap: 30px; font-size: 14px; }

    .nav-row a:hover { color: var(--nav-text-hover); }

    /* ========== Hero（front-desk 实景大图 + 深色遮罩，撑满首屏） ========== */
    .hero {
      position: relative;
      flex: 1;
      min-height: 480px;
      background: #4D020E;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    /* 深色遮罩保证文字可读 */
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.32) 0%,
        rgba(0,0,0,0.42) 55%,
        rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }
    /* ========== 页脚（深藏青底 + 鎏金顶边 + 金 H + 联系信息） ========== */
    footer {
      background: var(--navy);
      color: #fff;
      padding: 30px 0 40px;
      position: relative;
      border-top: 3px solid var(--gold-warm);
    }
    footer .container {
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-logo {

    .footer-logo .hl-icon {

      display: flex; align-items: center; justify-content: center;

      font-size: 30px; font-weight: 700;
      color: var(--gold-warm);
      position: relative;
    }
    .footer-logo .hl-icon::before {
      content: ""; position: absolute; inset: 6px;
      border: 2px solid var(--gold-warm);
      border-radius: 3px;
    }
    .footer-logo .hl-icon span {
      position: relative; z-index: 1; line-height: 1;
    }
    .footer-name {
      font-family: "STSong","SimSun",serif;
      font-size: 22px; font-weight: 700;
      color: var(--gold-warm);
      letter-spacing: 2px;
    }
    .footer-info { text-align: right; }
    .footer-info p {
      font-size: 13px; color: #fff;
      line-height: 1.9;
    }

    /* ========== 响应式适配（横屏/竖屏） ========== */
    @media (max-width: 960px) {

      .nav { margin-left: 0; }

    /* ========== 手机端侧边导航（汉堡按钮 + 右侧抽屉） ========== */

      background: rgba(255,255,255,.9); border: 1.5px solid rgba(34,51,79,.28);
      border-radius: 8px; color: #22334F; cursor: pointer; flex: none;
    }
    .nav-toggle svg { width: 22px; height: 22px; }
    .nav-drawer {
      position: fixed; top: 0; right: 0; z-index: 1200;
      width: 78vw; max-width: 320px; height: 100%;
      background: #fff; box-shadow: -6px 0 26px rgba(34,51,79,.2);
      transform: translateX(103%); transition: transform .28s ease;
      display: flex; flex-direction: column; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .nav-drawer.open { transform: translateX(0); }
    .nav-mask {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1100;
      background: rgba(20,28,40,.45);
      opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility .28s ease;
    }
    .nav-mask.open { opacity: 1; visibility: visible; }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid rgba(201,169,97,.45);
      background: linear-gradient(135deg, #E6C094 0%, #D4A574 100%);

    .drawer-title {

    .drawer-close {

    .drawer-close svg { width: 18px; height: 18px; }
    .drawer-nav { display: flex; flex-direction: column; padding: 6px 0 12px; }
    .drawer-nav a {

    .drawer-nav a:active { background: rgba(200,16,46,.06); }
    .drawer-nav a.active { color: #C8102E; font-weight: 600; background: rgba(200,16,46,.05); }
    .drawer-foot {
      margin-top: auto; padding: 18px 20px 26px;
      font-size: 12px; line-height: 1.9; color: #6B7280;
      border-top: 1px solid rgba(201,169,97,.35);
    }
    .drawer-foot b { color: #C8102E; font-family: "STSong",serif; }
    @media (max-width: 760px) {
      .topbar-inner { flex-wrap: nowrap; justify-content: space-between; gap: 10px; }
      .topbar .nav { display: none; }
      .nav-toggle { display: inline-flex; }
    }
  </style>

<script>
  (function () {
    var btn = document.getElementById('navToggle');
    var drawer = document.getElementById('navDrawer');
    var mask = document.getElementById('navMask');
    var closeBtn = document.getElementById('navClose');
    if (!btn || !drawer || !mask) return;
    function openNav() {
      drawer.classList.add('open'); mask.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeNav() {
      drawer.classList.remove('open'); mask.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
    btn.addEventListener('click', function () {
      drawer.classList.contains('open') ? closeNav() : openNav();
    });
    closeBtn && closeBtn.addEventListener('click', closeNav);
    mask.addEventListener('click', closeNav);
    drawer.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeNav); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
    var here = (location.pathname.split('/').pop() || 'index.html');
    drawer.querySelectorAll('a[href]').forEach(function (a) {
      if (a.getAttribute('href').replace('./', '') === here) a.classList.add('active');
    });
  })();
</script>
